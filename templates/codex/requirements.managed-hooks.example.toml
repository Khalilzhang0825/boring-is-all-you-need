[features]
hooks = true
unified_exec = false

[hooks]
windows_managed_dir = "%STEADYAGENT_HOME_JSON%\\tools\\hooks"

[[hooks.SessionStart]]
matcher = "startup|resume|compact|clear"
[[hooks.SessionStart.hooks]]
type = "command"
command = "pwsh.exe -NoProfile -ExecutionPolicy Bypass -File \"%STEADYAGENT_HOME_JSON%\\tools\\hooks\\agent-hook-context.ps1\""
timeout = 60
statusMessage = "Loading Boring Is All You Need context"

[[hooks.PreToolUse]]
matcher = "Bash|PowerShell|shell_command|functions[.]shell_command|apply_patch|Edit|Write|MultiEdit|functions[.]apply_patch|multi_tool_use[.]parallel"
[[hooks.PreToolUse.hooks]]
type = "command"
command = "pwsh.exe -NoProfile -ExecutionPolicy Bypass -File \"%STEADYAGENT_HOME_JSON%\\tools\\hooks\\agent-hook-command-guard.ps1\" -GuardMode Unified -EnforcementMode Audit"
timeout = 60
statusMessage = "Checking command and file guardrails"

[[hooks.PreCompact]]
matcher = "manual|auto"
[[hooks.PreCompact.hooks]]
type = "command"
command = "pwsh.exe -NoProfile -ExecutionPolicy Bypass -File \"%STEADYAGENT_HOME_JSON%\\tools\\hooks\\agent-hook-precompact.ps1\""
timeout = 60
statusMessage = "Checking compaction state"
